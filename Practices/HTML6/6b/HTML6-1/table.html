<!DOCTYPE html>
<html>


<head>

<meta charset="UTF-8">
	
<title>HTML Practice 6 - Tables</title>

<style type="text/css">

table, th, td{
   border:1px, solid black;
   text-align: center;
   width: 550px;
   margin-left: auto;
   margin-right: auto;
   border-spacing: 5px;
   padding: 3px;
}

.caption{
   color: #003300;
   font-family: Arial, Helvetica, sans-serif;
   font-weight: bold;
}

.courses{
   background-color: #CCCCCC;
   width:25%;
   font-weight: bold;
}

.day{
   background-color: #99FF66;
}

.timeline{
   width:15%;
}

.bold{
   font-weight: bold;
}


</style>
</head>
<body>
<div>
   <table >

      <caption class="caption">My Class Schedule</caption>

      <colgroup>
         <col span="1" class="courses">
         <col span="5" class="timeline">
      </colgroup>

      <th class="courses">Courses</th>
      <th class="day">Monday</th>
      <th class="day">Tuesday</th>
      <th class="day">Wednesday</th>
      <th class="day">Thursday</th>
      <th class="day">Friday</th>

      <tr>
         <td class="bold">INFO-2420</td>
         <td colspan="5">Online</td>
      </tr>

      <tr>
         <td class="bold">ARTH-3010</td>
         <td colspan="5">Online</td>
      </tr>

      <tr>
         <td class="bold">ART-1020</td>
         <td>2-4</td>
         <td>2-4</td>
         <td>2-4</td>
         <td>2-4</td>
         <td></td>
      </tr>

      <tr>
         <td class="bold">ARTH-309G</td>
         <td>Virtual lecture</td>
         <td colspan="4">Online</td>
      </tr>


	
   </table>
</div>



</body>
</html>
